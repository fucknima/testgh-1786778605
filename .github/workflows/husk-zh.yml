name: Husk 3.0 深度中文资源版
on:
  workflow_dispatch:
  push:
    paths:
      - 'husk-zh/**'
      - '.github/workflows/husk-zh.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download Husk 3.0 sources (sparse checkout)
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch 3.0 \
            https://github.com/Leviidev/Husk.git /tmp/Husk-3.0
          git -C /tmp/Husk-3.0 sparse-checkout set src/app/Husk \
            src/app/HuskDownloadsWidget src/app/HuskJITHelper src/app/Shared
      - name: Audit and translate all source UI strings
        run: |
          python3 husk-zh/expand_localizations.py \
            --source /tmp/Husk-3.0/src/app \
            --existing husk-zh/Localizable.strings \
            --output husk-zh/GeneratedLocalizable.strings \
            --report husk-zh/translation_report.json
          cat husk-zh/translation_report.json
      - name: Download official Husk 3.0 IPA
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            "https://github.com/Leviidev/Husk/releases/download/3.0/Husk.ipa" \
            -o Husk.ipa
      - name: Repack IPA, preserve executable hashes and validate ZIP
        run: |
          python3 husk-zh/patch_ipa.py \
            Husk.ipa Husk-3.0-zh2.ipa husk-zh/GeneratedLocalizable.strings
          unzip -tqq Husk-3.0-zh2.ipa
          ls -lh Husk-3.0-zh2.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Husk-3.0-zh2-IPA-and-audit
          path: |
            Husk-3.0-zh2.ipa
            husk-zh/GeneratedLocalizable.strings
            husk-zh/translation_report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish version 2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=husk-3.0-zh2
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Husk-3.0-zh2.ipa husk-zh/translation_report.json --clobber
          else
            gh release create "$TAG" Husk-3.0-zh2.ipa husk-zh/translation_report.json \
              --title "Husk 3.0 中文增强资源版 (v2)" \
              --notes "从 Husk 3.0 全部 SwiftUI 源码提取文案，扩展简体中文资源表，兼顾主 App 及小组件。原版 Mach-O 二进制未改动，IPA 需重新签名。注意：Text(String) 动态标题和模拟器内部文本不能用资源补丁彻底解决，仍可能显示英文。源码和审计报告见本仓库 husk-zh/。原作者 Leviidev/Husk，GPL-2.0-or-later。"
          fi
      - name: Save generated strings and coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add husk-zh/GeneratedLocalizable.strings husk-zh/translation_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit all upstream Husk 3.0 strings and publish Chinese translations"
            git push
          fi
