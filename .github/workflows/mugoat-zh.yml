name: Build Mugoat v4 UI Chinese dylib
on:
  push:
    branches: [mugoat-zh-ui-complete-v4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate translations
        run: |
          cd mugoat-zh
          python3 generate_header.py
          python3 generate_swift_map.py
          python3 - <<'PY'
          import json
          d=json.load(open("ui_extras_zh.json"))
          names=["Độ bám đường & Drift (Handling Mod)","Tùy biến độ bám bánh xe: Mặc định, Siêu bám hoặc Drift","Tăng tốc độ xe cộ (Speed Multiplier)","Nhân đôi tốc độ tối đa của mọi phương tiện","Vô hạn đạn & Không cần nạp đạn","Bắn liên tục không bao giờ hết đạn","Không giật khi bắn (No Recoil)","Tâm súng đứng yên 100% khi sấy liên thanh","Trọng lực tùy chỉnh (Gravity Mod)","Chuyển đổi giữa trọng lực Trái đất và Mặt trăng","Các tinh chỉnh can thiệp trực tiếp vào cơ chế vật lý của game (handling xe, trọng lực, vũ khí) mà không làm crash game."]
          assert all(name in d and d[name] for name in names)
          assert d["Done"] == "完成"
          print("All 11 screenshot untranslated entries exist in the runtime UIKit dictionary.")
          PY
      - name: SwiftUI macOS runtime smoke test
        shell: bash
        run: |
          set -euxo pipefail
          cd mugoat-zh
          clang -c -O1 MugoatZH_Interpose.c -o Interpose-mac.o
          swiftc -swift-version 5 -emit-library -parse-as-library -module-name MugoatZH -o libMugoatZH-mac.dylib MugoatZH_SwiftUI.swift MugoatZHGenerated.swift Interpose-mac.o -framework SwiftUI -framework Foundation
          swiftc -swift-version 5 -o MugoatZHProbe MugoatZHProbe.swift -framework SwiftUI
          DYLD_INSERT_LIBRARIES="$PWD/libMugoatZH-mac.dylib" ./MugoatZHProbe | tee /tmp/MugoatZH-smoke.txt
          grep -q MUGOAT_ZH_PROBE_PASS /tmp/MugoatZH-smoke.txt
      - name: Build iOS arm64 variants
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 -isysroot "$SDK" -fobjc-arc -fmodules -O2 -DMZH_UI_EXTRAS=1 -c mugoat-zh/MugoatZH.m -o /tmp/MugoatResource.o
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 -isysroot "$SDK" -O2 -c mugoat-zh/MugoatZH_Interpose.c -o /tmp/MugoatInterpose.o
          xcrun --sdk iphoneos swiftc -swift-version 5 -target arm64-apple-ios15.0 -sdk "$SDK" -parse-as-library -emit-library -module-name MugoatZH mugoat-zh/MugoatZH_SwiftUI.swift mugoat-zh/MugoatZHGenerated.swift /tmp/MugoatResource.o /tmp/MugoatInterpose.o -o dist/MugoatZH-v4.dylib -Xlinker -install_name -Xlinker '@executable_path/Frameworks/MugoatZH-v4.dylib'
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -dynamiclib -fobjc-arc -fmodules -O2 -DMZH_UI_EXTRAS=0 -framework Foundation -o dist/MugoatZH-ResourceOnly-v4.dylib mugoat-zh/MugoatZH.m -Wl,-install_name,@executable_path/Frameworks/MugoatZH-ResourceOnly-v4.dylib
          for file in dist/*.dylib; do
            test "$(xcrun --sdk iphoneos lipo -archs "$file")" = arm64
            codesign --force --sign - "$file"
            codesign --verify "$file"
            xcrun --sdk iphoneos otool -L "$file"
            shasum -a 256 "$file"
          done
          cp /tmp/MugoatZH-smoke.txt dist/Mac-SwiftUI-Test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mugoat-ZH-v4-UIKit-SwiftUI-ios-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
