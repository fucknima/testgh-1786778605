name: Build Mugoat Full Chinese Dylibs
on:
  push:
    branches: [mugoat-zh-full-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dylib:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate translations and verify source
        run: |
          set -euo pipefail
          cd mugoat-zh
          python3 generate_header.py
          grep -q 'MZHTranslationMap' GeneratedTranslations.h
      - name: Build arm64 iOS dylib
        run: |
          set -euo pipefail
          mkdir -p dist
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for variant in Full ResourceOnly; do
            if [ "$variant" = "Full" ]; then
              filename="MugoatZH.dylib"
              hooks=1
            else
              filename="MugoatZH-ResourceOnly.dylib"
              hooks=0
            fi
            xcrun --sdk iphoneos clang \
              -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
              -fobjc-arc -fmodules -O2 -dynamiclib -DMZH_UI_EXTRAS="$hooks" \
              -Wl,-install_name,@executable_path/Frameworks/"$filename" \
              -framework Foundation -framework UIKit \
              -o "dist/$filename" mugoat-zh/MugoatZH.m
            test "$(xcrun --sdk iphoneos lipo -archs "dist/$filename")" = arm64
            codesign --force --sign - "dist/$filename"
            codesign --verify "dist/$filename"
            xcrun --sdk iphoneos otool -L "dist/$filename"
            shasum -a 256 "dist/$filename"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MugoatZH-full-v2-ios-arm64
          path: dist/*.dylib
          retention-days: 30

