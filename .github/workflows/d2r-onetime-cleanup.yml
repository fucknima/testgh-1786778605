name: One-time cleanup of duplicate D2R draft
on:
  push:
    paths:
      - .github/workflows/d2r-onetime-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check precisely identified duplicate drafts and delete second
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="fucknima/testgh-1786778605"
          KEEP_ID="412309207"
          DROP_ID="412310431"
          KEEP="$(gh api "repos/$REPO/releases/$KEEP_ID")"
          DROP="$(gh api "repos/$REPO/releases/$DROP_ID")"
          jq -en --argjson a "$KEEP" --argjson b "$DROP" '
            $a.draft == true and $b.draft == true and
            $a.tag_name == $b.tag_name and
            ($a.tag_name | startswith("d2r-signfix-d2r-3.3.94012-dc3cc22b-")) and
            ($a.assets | length) == 4 and ($b.assets | length) == 4 and
            (($a.assets | map({name,size}) | sort_by(.name)) ==
             ($b.assets | map({name,size}) | sort_by(.name)))
          '
          gh api -X DELETE "repos/$REPO/releases/$DROP_ID"
          echo "Removed only duplicate draft $DROP_ID, retained verified original $KEEP_ID"
