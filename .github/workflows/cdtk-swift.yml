name: CDTK Swift Native
on:
  push:
    branches:
      - feature/cdtk-swift-native
    paths:
      - "CDTKSwift/**"
      - ".github/workflows/cdtk-swift.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and extract native Swift sources
        shell: bash
        run: |
          set -euo pipefail
          cat CDTKSwift/bootstrap/part*.txt | base64 -D > /tmp/cdtk-native-src.txz
          echo "7620df561a460d3613f50d5367c380d18c27a9068c7045d4281378cfe7936089  /tmp/cdtk-native-src.txz" | shasum -a 256 -c -
          if [ ! -f CDTKSwift/CDTKSwift/Core/CoreDeviceClient.swift ]; then
            tar -xJf /tmp/cdtk-native-src.txz -C CDTKSwift
          else
            echo 'Existing expanded Swift files preserved; bootstrap archive verified.'
          fi
          test -f CDTKSwift/project.yml
          test -f CDTKSwift/CDTKSwift/Core/CoreDeviceClient.swift

      - name: Generate native light/dark app icons
        run: swift CDTKSwift/Scripts/generate_icons.swift

      - name: Publish readable source code to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CDTKSwift
          if ! git diff --cached --quiet; then
            git commit -m "build: publish extracted Swift native project"
            git push origin HEAD:feature/cdtk-swift-native
          fi

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: CDTKSwift
        run: xcodegen generate

      - name: Verify Swift codec tests
        working-directory: CDTKSwift
        run: |
          swiftc -o /tmp/cdtk-wire-test CDTKSwift/Core/WireCodec.swift Tests/WireCodecSmoke.swift
          /tmp/cdtk-wire-test

      - name: Build unsigned iPhone application
        working-directory: CDTKSwift
        run: |
          set -o pipefail
          xcodebuild -project CDTKSwift.xcodeproj -scheme CDTKSwift -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned IPA
        working-directory: CDTKSwift
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CDTKSwift.app Payload/
          zip -qr CDTKSwift-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDTKSwift-unsigned-ipa
          path: CDTKSwift/CDTKSwift-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
