name: D2R iSigner Mach-O CodeSignature diagnosis
on:
  workflow_dispatch:
  push:
    branches: [d2r-ios-signing-audit]
jobs:
  inspect-and-sign:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download published IPA and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o original.ipa \
           'https://github.com/jiayx/d2r-mobile-build/releases/download/d2r-3.3.94012-ea86e796-game-3.3.94012-v1/D2RMobile-unsigned.ipa'
          echo '55cd535f83b0c3d7f6ddee7938eb860fd02c5eb8827efaa312b2da665c3d5289  original.ipa' | shasum -a 256 -c -
          python3 -c 'import zipfile;z=zipfile.ZipFile("original.ipa");z.extractall("original");print("ZIP integrity",z.testzip())'
      - name: Native codesign repair on nested framework and main App
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/original/Payload/DmIOS.app"
          codesign --force --sign - --timestamp=none --verbose=3 "$APP/Frameworks/Guest.framework"
          codesign --force --sign - --timestamp=none --verbose=3 "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Frameworks/Guest.framework"
          otool -l "$APP/Frameworks/Guest.framework/Guest" | grep -A 4 'cmd LC_CODE_SIGNATURE'
          otool -l "$APP/DmIOS" | grep -A 4 'cmd LC_CODE_SIGNATURE'
          echo 'NATIVE_CODESIGN_VERIFY: PASS'
      - name: Repack IPA and validate signatures in Mach-O
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,os,hashlib,struct
          folder="original"
          out="D2RMobile-PreSigned-For-Resign.ipa"
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for root,dirs,files in os.walk(os.path.join(folder,"Payload")):
                  for fn in files:
                      path=os.path.join(root,fn)
                      z.write(path,os.path.relpath(path,folder))
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              def signature_info(raw):
                  assert struct.unpack_from('<I',raw)[0] == 0xfeedfacf
                  ncmds=struct.unpack_from('<I',raw,16)[0]
                  off=32
                  for i in range(ncmds):
                      cmd,cmdsize=struct.unpack_from('<II',raw,off)
                      if cmd==0x1d:
                          sigoff,sigsize=struct.unpack_from('<II',raw,off+8)
                          assert sigoff>0 and sigsize>0 and sigoff+sigsize<=len(raw)
                          return (sigoff,sigsize)
                      off+=cmdsize
                  raise ValueError('Missing code signature load command')
              for path in ['Payload/DmIOS.app/DmIOS','Payload/DmIOS.app/Frameworks/Guest.framework/Guest']:
                  print(path,signature_info(z.read(path)))
          with open(out,'rb') as fp:h=hashlib.file_digest(fp,'sha256').hexdigest()
          print("SIGNING_REPAIR: PASS",os.path.getsize(out),h)
          with open("SIGNING-NOTE.txt","w") as fp:fp.write("D2R Mobile: ad hoc Mach-O pre-signature, not an Apple device certificate. Re-sign the IPA using your own certificate and provisioning profile.\\nSHA256: "+h+"\\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: D2RMobile-PreSigned-For-Resign
          path: |
            D2RMobile-PreSigned-For-Resign.ipa
            SIGNING-NOTE.txt
          if-no-files-found: error
          retention-days: 3
