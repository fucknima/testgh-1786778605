name: Build MuguetCN iOS dylib
on:
  push:
    branches:
      - muguet-88-cn-dylib
  workflow_dispatch:
jobs:
  ios-dylib:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dynamic library
        run: bash build-macos.sh
      - name: Verify dynamic library
        run: |
          test -s MuguetCN.dylib
          file MuguetCN.dylib | grep -E 'Mach-O.*arm64'
          xcrun otool -hv MuguetCN.dylib
          codesign --verify --verbose=2 MuguetCN.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MuguetCN-arm64-ios-dylib
          path: MuguetCN.dylib
          if-no-files-found: error
