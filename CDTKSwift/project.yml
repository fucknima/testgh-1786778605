name: CDTKSwift
options:
  bundleIdPrefix: com.cdtk
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 'CoreDevice 工具箱'
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: '用于连接本机的 CoreDevice Remote Pairing 服务。'
    INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_UISupportsDocumentBrowser: NO
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    INFOPLIST_KEY_UILaunchScreen_Generation: NO
    CODE_SIGN_ENTITLEMENTS: ''
targets:
  CDTKSwift:
    type: application
    platform: iOS
    sources:
      - path: CDTKSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cdtk.swifttoolkit
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
